<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTB LECIP MON2 SIMULATOR</title>
  <style>
    :root {
      --ctb-yellow: #FFD100;
      --ctb-dark-blue: #0A1931;
      --ctb-blue: #004B87;
      --ctb-red: #D71920;
      --text-black: #111111;
      --bg-panel: #EAEAEA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans HK", sans-serif; }
    body { background: #1a1a1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
    .layout-container { display: flex; gap: 20px; max-width: 1200px; width: 100%; flex-wrap: wrap; justify-content: center; }

    /* 控制面板 */
    .controls-panel { flex: 1; min-width: 320px; max-width: 420px; background: #2a2a2a; border-radius: 10px; padding: 15px; font-size: 13px; }
    .controls-panel h2 { font-size: 16px; margin-bottom: 12px; border-bottom: 2px solid var(--ctb-yellow); padding-bottom: 5px; color: var(--ctb-yellow); }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 4px; color: #bbb; }
    .form-control { width: 100%; padding: 6px 10px; background: #3a3a3a; border: 1px solid #555; color: #fff; border-radius: 4px; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; background: #444; color: #fff; }
    .btn-primary { background: #0078d4; }
    .btn-gps.active { background: #107c41; }
    .status-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; background: #555; margin-left: 5px; }
    .status-badge.ok { background: #107c41; }

    /* MON2 螢幕外框 */
    .mon2-bezel { background: #4B2E83; border: 10px solid #2B1556; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); overflow: hidden; position: relative; }
    .mon2-portrait { width: 420px; height: 746px; }
    .mon2-landscape { width: 746px; height: 420px; }

    /* MON2 內部 UI 佈局 */
    .mon2-screen { width: 100%; height: 100%; background: var(--bg-panel); color: var(--text-black); display: flex; flex-direction: column; position: relative; }
    
    /* 頂欄 */
    .mon2-header { display: flex; height: 75px; border-bottom: 3px solid var(--ctb-yellow); background: #fff; }
    .header-route { width: 120px; background: var(--ctb-blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 900; }
    .header-dest { flex: 1; background: var(--ctb-yellow); padding: 5px 12px; display: flex; flex-direction: column; justify-content: center; }
    .header-dest .dest-zh { font-size: 20px; font-weight: bold; }
    .header-dest .dest-en { font-size: 13px; color: #333; }
    .header-time { width: 85px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .header-time .time-title { font-size: 10px; color: #666; }
    .header-time .time-val { font-size: 18px; font-weight: bold; }

    /* 中間顯示主區域 */
    .mon2-body { flex: 1; position: relative; overflow: hidden; }
    .mode-view { width: 100%; height: 100%; display: none; }
    .mode-view.active { display: flex; flex-direction: column; }

    /* 狀態提示欄 (此站 / 下一站) */
    .status-sub-bar { background: #fff; padding: 4px 15px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }

    /* 三站模式樣式 (Mode 1 & 2) */
    .ladder-container { flex: 1; display: flex; flex-direction: column; padding: 10px 0; }
    .ladder-row { display: flex; align-items: center; flex: 1; padding: 0 15px; position: relative; }
    .ladder-row:not(:last-child)::after { content: ""; position: absolute; left: 34px; top: 50%; width: 6px; height: 100%; background: #0078d4; z-index: 1; }
    .stop-bubble { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 3px solid #0078d4; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; z-index: 2; }
    .ladder-row.current .stop-bubble { background: #8BC34A; border-color: #558B2F; color: #fff; }
    .stop-info { margin-left: 15px; flex: 1; }
    .stop-main { font-size: 22px; font-weight: bold; }
    .stop-sub { font-size: 12px; color: #666; }
    .stop-eta-badge { text-align: right; min-width: 75px; font-weight: bold; color: var(--ctb-red); font-size: 16px; }

    /* 全線黃白總表 (Mode 5) */
    .overview-table { width: 100%; height: 100%; display: flex; flex-direction: column; font-size: 13px; }
    .overview-row { display: flex; align-items: center; flex: 1; padding: 0 10px; }
    .overview-row.yellow { background: #FFF9C4; }
    .overview-row.white { background: #FFFFFF; }
    .overview-seq { width: 30px; font-weight: bold; text-align: center; }
    .overview-name-zh { flex: 1; font-weight: bold; }
    .overview-name-en { flex: 1; font-size: 11px; color: #555; }
    .overview-eta { width: 60px; text-align: right; color: var(--ctb-red); font-weight: bold; }

    /* 電子海報 (Mode 4) */
    .poster-container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 25px; background: linear-gradient(135deg, #0A1931, #004B87); color: #fff; }
    .poster-title { font-size: 24px; font-weight: 900; color: var(--ctb-yellow); margin-bottom: 15px; }
    .poster-desc { font-size: 14px; line-height: 1.6; max-width: 320px; }

    /* 底欄 (車長資訊 / App 資訊) */
    .mon2-footer { height: 42px; border-top: 2px solid var(--ctb-red); background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; cursor: pointer; user-select: none; }
    .driver-name { font-weight: bold; font-size: 13px; }
    .driver-sub { font-size: 11px; color: #555; }
    .driver-badge { background: var(--ctb-dark-blue); color: #fff; padding: 4px 8px; font-size: 11px; font-weight: bold; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%); }
    .app-promo { font-size: 12px; font-weight: bold; color: var(--ctb-blue); text-align: center; width: 100%; }
  </style>
</head>
<body>

  <div class="layout-container">
    <!-- 車載屏幕 -->
    <div class="mon2-bezel mon2-portrait" id="mon2Frame">
      <div class="mon2-screen">
        <!-- 頂部資訊列 -->
        <div class="mon2-header">
          <div class="header-route" id="uiRoute">---</div>
          <div class="header-dest">
            <div class="dest-zh" id="uiDestZh">載入中...</div>
            <div class="dest-en" id="uiDestEn">Loading...</div>
          </div>
          <div class="header-time">
            <span class="time-title">現在時間 Time Now</span>
            <span class="time-val" id="uiClock">--:--</span>
          </div>
        </div>

        <!-- 狀態次頂欄 -->
        <div class="status-sub-bar" id="uiSubBar">
          <span id="uiStatusText">此站 This stop</span>
          <span id="uiPageIndicator">1/1</span>
        </div>

        <!-- 主視圖區域 -->
        <div class="mon2-body">
          <!-- Mode 1: 中文三站 -->
          <div class="mode-view active" id="viewMode1">
            <div class="ladder-container" id="ladderZh"></div>
          </div>

          <!-- Mode 2: 英文三站 -->
          <div class="mode-view" id="viewMode2">
            <div class="ladder-container" id="ladderEn"></div>
          </div>

          <!-- Mode 5: 多頁站表總覽 -->
          <div class="mode-view" id="viewMode5">
            <div class="overview-table" id="overviewList"></div>
          </div>

          <!-- Mode 4: 宣傳海報 -->
          <div class="mode-view" id="viewMode4">
            <div class="poster-container">
              <div class="poster-title" id="posterTitle">#MISSIONZERO</div>
              <div class="poster-desc" id="posterDesc">零排放 由此啟動<br>城巴致力推動全港綠色公共交通發展</div>
            </div>
          </div>
        </div>

        <!-- 底欄 (點擊可切換車長/App) -->
        <div class="mon2-footer" id="mon2Footer" title="點擊切換顯示車長或 App 下載資訊">
          <div id="footerDriverWrap" style="display: flex; width: 100%; justify-content: space-between; align-items: center;">
            <div>
              <div class="driver-name" id="uiDriverZh">李車長</div>
              <div class="driver-sub" id="uiDriverEn">Bus Captain Li</div>
            </div>
            <div>
              <span style="font-size:10px; color:#555;">員工編號 Staff No.</span>
              <strong id="uiDriverId" style="font-size:14px; margin-left:4px;">34006</strong>
            </div>
            <div class="driver-badge">為您服務<br>is serving you</div>
          </div>
          <div class="app-promo" id="footerAppWrap" style="display: none;">
            📱 下載 Citybus App 查閱即時抵站時間
          </div>
        </div>
      </div>
    </div>

    <!-- 控制儀表板 -->
    <div class="controls-panel">
      <h2>CTB MON2 運作控制台</h2>

      <div class="form-group">
        <label>路線選擇 Route</label>
        <select id="routeSelect" class="form-control">
          <option value="905">905 - 荔枝角 ⇄ 會展站</option>
          <option value="780">780 - 柴灣(東) ⇄ 中環碼頭</option>
          <option value="A12">A12 - 機場 ⇄ 小西灣(藍灣半島)</option>
          <option value="702">702 - 海麗邨 ⇄ 又一城</option>
        </select>
      </div>

      <div class="form-group">
        <label>行駛方向 Direction</label>
        <select id="dirSelect" class="form-control">
          <option value="outbound">去程 Outbound</option>
          <option value="inbound">回程 Inbound</option>
        </select>
      </div>

      <div class="form-group">
        <label>車長資料 (自訂)</label>
        <div style="display:flex; gap:5px;">
          <input type="text" id="driverSurnameZh" class="form-control" placeholder="中文姓 (如:李)" value="李">
          <input type="text" id="driverSurnameEn" class="form-control" placeholder="英文姓 (如:Li)" value="Li">
          <input type="text" id="driverId" class="form-control" placeholder="員工編號" value="34006" style="width:90px;">
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-gps" id="btnGpsToggle">🛰️ 啟用真實 GPS 報站</button>
        <button class="btn" id="btnOrientation">🔄 直向/橫向切換</button>
      </div>

      <div style="margin-top:15px; padding:10px; background:#222; border-radius:6px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span>GPS 狀態: <span id="gpsStatus" class="status-badge">未啟用</span></span>
          <span>車速: <span id="gpsSpeed">--</span> km/h</span>
        </div>
        <div>預估抵站時間計算: <strong>實時動態剩餘分鐘 (ETA)</strong></div>
        <div style="font-size:11px; color:#aaa; margin-top:4px;" id="gpsDetail">尚未連線 GPS 定位</div>
      </div>
    </div>
  </div>

  <script>
    // 預設示範路線站點 (含座標及預估分段)
    const ROUTE_DATA = {
      "905": {
        outbound: {
          destZh: "荔枝角(盈暉臺)", destEn: "Lai Chi Kok (Nob Hill)",
          stops: [
            { id: "001", nameZh: "會展站", nameEn: "Exhibition Centre Station", lat: 22.2829, lon: 114.1751 },
            { id: "002", nameZh: "菲林明道", nameEn: "Fleming Road", lat: 22.2798, lon: 114.1738 },
            { id: "003", nameZh: "盧押道", nameEn: "Luard Road", lat: 22.2783, lon: 114.1704 },
            { id: "004", nameZh: "金鐘 - 高等法院", nameEn: "Admiralty - High Court", lat: 22.2790, lon: 114.1648 },
            { id: "005", nameZh: "中銀大廈", nameEn: "Bank of China Tower", lat: 22.2797, lon: 114.1615 },
            { id: "006", nameZh: "利源東街", nameEn: "Li Yuen Street East", lat: 22.2825, lon: 114.1569 },
            { id: "007", nameZh: "中環街市", nameEn: "Central Market", lat: 22.2842, lon: 114.1549 },
            { id: "008", nameZh: "文華里", nameEn: "Man Wa Lane", lat: 22.2861, lon: 114.1517 },
            { id: "009", nameZh: "西港城", nameEn: "Western Market", lat: 22.2874, lon: 114.1501 },
            { id: "010", nameZh: "皇后街", nameEn: "Queen Street", lat: 22.2876, lon: 114.1472 },
            { id: "011", nameZh: "高陞街", nameEn: "Ko Shing Street", lat: 22.2878, lon: 114.1449 },
            { id: "012", nameZh: "正街", nameEn: "Centre Street", lat: 22.2879, lon: 114.1425 },
            { id: "013", nameZh: "水街", nameEn: "Water Street", lat: 22.2867, lon: 114.1398 },
            { id: "014", nameZh: "西區海底隧道轉車站", nameEn: "Western Harbour Crossing", lat: 22.3025, lon: 114.1585 },
            { id: "015", nameZh: "富榮花園", nameEn: "Charming Garden", lat: 22.3150, lon: 114.1642 },
            { id: "016", nameZh: "荔枝角(盈暉臺)", nameEn: "Lai Chi Kok (Nob Hill)", lat: 22.3375, lon: 114.1390 }
          ]
        }
      },
      "780": {
        outbound: {
          destZh: "中環碼頭", destEn: "Central (Ferry Piers)",
          stops: [
            { id: "101", nameZh: "柴灣(東)", nameEn: "Chai Wan (East)", lat: 22.2680, lon: 114.2460 },
            { id: "102", nameZh: "樂軒臺", nameEn: "Lok Hin Terrace", lat: 22.2642, lon: 114.2398 },
            { id: "103", nameZh: "環翠商場", nameEn: "Wan Tsui Shopping Centre", lat: 22.2625, lon: 114.2372 },
            { id: "104", nameZh: "舊灣仔警署", nameEn: "Old Wan Chai Police Station", lat: 22.2798, lon: 114.1740 },
            { id: "105", nameZh: "分域街", nameEn: "Fenwick Street", lat: 22.2789, lon: 114.1695 },
            { id: "106", nameZh: "海富中心", nameEn: "Admiralty Centre", lat: 22.2798, lon: 114.1650 }
          ]
        }
      }
    };

    const POSTERS = [
      { title: "#MISSIONZERO", desc: "零排放 由此啟動<br>城巴致力推動綠色能源公共交通發展" },
      { title: "請緊握扶手", desc: "行車時請緊握扶手<br>安全乘車 顧己及人" },
      { title: "請佩戴安全帶", desc: "法例規定座位設有安全帶時<br>乘客必須全程佩戴" }
    ];

    // 全域狀態機
    let currentRoute = "905";
    let currentDir = "outbound";
    let currentStopIndex = 0;
    let currentMode = 1; // 1: 中文三站, 2: 英文三站, 5: 站表總覽, 4: 海報
    let pageOverviewIndex = 1;
    let isGpsActive = false;
    let gpsWatchId = null;

    // 音效合成器 (Ding-Dong)
    function playDingDong() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.frequency.setValueAtTime(830, now);
        osc1.frequency.exponentialRampToValueAtTime(622, now + 0.35);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);

        osc1.connect(gain);
        gain.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.7);
      } catch (e) {
        console.warn("音效播放未觸發 (需使用者互動)", e);
      }
    }

    // 更新時鐘
    setInterval(() => {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('uiClock').textContent = `${h}:${m}`;
    }, 1000);

    // 取得當前路線車站陣列
    function getStops() {
      return (ROUTE_DATA[currentRoute] && ROUTE_DATA[currentRoute][currentDir]) 
        ? ROUTE_DATA[currentRoute][currentDir].stops 
        : [];
    }

    // 計算大圓距離 (米)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const phi1 = lat1 * Math.PI / 180;
      const phi2 = lat2 * Math.PI / 180;
      const deltaPhi = (lat2 - lat1) * Math.PI / 180;
      const deltaLambda = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 渲染 UI
    function render() {
      const routeInfo = ROUTE_DATA[currentRoute][currentDir];
      const stops = getStops();
      const currentStop = stops[currentStopIndex] || { nameZh: "---", nameEn: "---" };

      // 頂欄
      document.getElementById('uiRoute').textContent = currentRoute;
      document.getElementById('uiDestZh').textContent = "往 " + routeInfo.destZh;
      document.getElementById('uiDestEn').textContent = "to " + routeInfo.destEn;

      // 隱藏所有視圖
      document.querySelectorAll('.mode-view').forEach(el => el.classList.remove('active'));

      // 渲染三站模式 (Mode 1 & Mode 2)
      if (currentMode === 1 || currentMode === 2) {
        const isZh = (currentMode === 1);
        const container = isZh ? document.getElementById('ladderZh') : document.getElementById('ladderEn');
        document.getElementById(isZh ? 'viewMode1' : 'viewMode2').classList.add('active');
        document.getElementById('uiStatusText').textContent = isZh ? "此站 This stop" : "Next stop";
        document.getElementById('uiPageIndicator').textContent = "";

        container.innerHTML = "";
        for (let i = 0; i < 3; i++) {
          const idx = currentStopIndex + i;
          if (idx < stops.length) {
            const stop = stops[idx];
            const etaMinutes = (i === 0) ? "此站" : `${i * 3} 分鐘`;
            const row = document.createElement('div');
            row.className = `ladder-row ${i === 0 ? 'current' : ''}`;
            row.innerHTML = `
              <div class="stop-bubble">${idx + 1}</div>
              <div class="stop-info">
                <div class="stop-main">${isZh ? stop.nameZh : stop.nameEn}</div>
                <div class="stop-sub">${isZh ? stop.nameEn : stop.nameZh}</div>
              </div>
              <div class="stop-eta-badge">${etaMinutes}</div>
            `;
            container.appendChild(row);
          }
        }
      }

      // 渲染站表總覽 (Mode 5 - 支援多於 13 站自動開新頁)
      else if (currentMode === 5) {
        document.getElementById('viewMode5').classList.add('active');
        const container = document.getElementById('overviewList');
        container.innerHTML = "";

        const remainingStops = stops.slice(currentStopIndex);
        const totalPages = remainingStops.length > 13 ? Math.ceil((remainingStops.length - 13) / 10) + 1 : 1;
        document.getElementById('uiPageIndicator').textContent = `${pageOverviewIndex}/${totalPages}`;

        let displaySlice = [];
        if (pageOverviewIndex === 1) {
          displaySlice = remainingStops.slice(0, 13);
        } else {
          const start = 13 + (pageOverviewIndex - 2) * 10;
          displaySlice = remainingStops.slice(start, start + 10);
        }

        displaySlice.forEach((stop, i) => {
          const globalIdx = stops.indexOf(stop);
          const row = document.createElement('div');
          row.className = `overview-row ${i % 2 === 0 ? 'yellow' : 'white'}`;
          row.innerHTML = `
            <div class="overview-seq">${globalIdx + 1}</div>
            <div class="overview-name-zh">${stop.nameZh}</div>
            <div class="overview-name-en">${stop.nameEn}</div>
            <div class="overview-eta">${(globalIdx - currentStopIndex) * 2 + 1} 分鐘</div>
          `;
          container.appendChild(row);
        });
      }

      // 渲染海報 (Mode 4 - 隨機抽取)
      else if (currentMode === 4) {
        document.getElementById('viewMode4').classList.add('active');
        document.getElementById('uiStatusText').textContent = "宣傳資訊 Promotion";
        document.getElementById('uiPageIndicator').textContent = "";
        const p = POSTERS[Math.floor(Math.random() * POSTERS.length)];
        document.getElementById('posterTitle').innerHTML = p.title;
        document.getElementById('posterDesc').innerHTML = p.desc;
      }
    }

    // 版面定時輪替循環 (7秒 / 3秒)
    setInterval(() => {
      const stops = getStops();
      const remainingStops = stops.slice(currentStopIndex);
      const totalPages = remainingStops.length > 13 ? Math.ceil((remainingStops.length - 13) / 10) + 1 : 1;

      if (currentMode === 1) currentMode = 2;
      else if (currentMode === 2) { currentMode = 5; pageOverviewIndex = 1; }
      else if (currentMode === 5) {
        if (pageOverviewIndex < totalPages) {
          pageOverviewIndex++;
        } else {
          currentMode = 4; // 進入隨機海報
        }
      }
      else if (currentMode === 4) currentMode = 1;

      render();
    }, 5000);

    // 車長資訊即時響應
    function updateDriver() {
      const zh = document.getElementById('driverSurnameZh').value || "李";
      const en = document.getElementById('driverSurnameEn').value || "Li";
      const id = document.getElementById('driverId').value || "34006";

      document.getElementById('uiDriverZh').textContent = `${zh}車長`;
      document.getElementById('uiDriverEn').textContent = `Bus Captain ${en}`;
      document.getElementById('uiDriverId').textContent = id;
    }
    document.querySelectorAll('#driverSurnameZh, #driverSurnameEn, #driverId').forEach(input => {
      input.addEventListener('input', updateDriver);
    });

    // 螢幕底部點擊切換 (車長 / App 宣傳)
    document.getElementById('mon2Footer').addEventListener('click', () => {
      const d = document.getElementById('footerDriverWrap');
      const a = document.getElementById('footerAppWrap');
      if (d.style.display === 'none') {
        d.style.display = 'flex';
        a.style.display = 'none';
      } else {
        d.style.display = 'none';
        a.style.display = 'block';
      }
    });

    // 直向 / 橫向切換
    document.getElementById('btnOrientation').addEventListener('click', () => {
      const frame = document.getElementById('mon2Frame');
      frame.classList.toggle('mon2-portrait');
      frame.classList.toggle('mon2-landscape');
    });

    // GPS 實時定位報站核心
    document.getElementById('btnGpsToggle').addEventListener('click', () => {
      if (!isGpsActive) {
        if (!navigator.geolocation) {
          alert("此瀏覽器或設備不支援 GPS 定位。");
          return;
        }
        gpsWatchId = navigator.geolocation.watchPosition(handleGpsUpdate, handleGpsError, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
        isGpsActive = true;
        document.getElementById('btnGpsToggle').classList.add('active');
        document.getElementById('btnGpsToggle').textContent = "🛑 關閉 GPS 定位";
        document.getElementById('gpsStatus').textContent = "定位中...";
        document.getElementById('gpsStatus').className = "status-badge ok";
      } else {
        navigator.geolocation.clearWatch(gpsWatchId);
        isGpsActive = false;
        document.getElementById('btnGpsToggle').classList.remove('active');
        document.getElementById('btnGpsToggle').textContent = "🛰️ 啟用真實 GPS 報站";
        document.getElementById('gpsStatus').textContent = "未啟用";
        document.getElementById('gpsStatus').className = "status-badge";
      }
    });

    function handleGpsUpdate(position) {
      const { latitude, longitude, speed } = position.coords;
      const speedKmH = speed ? Math.round(speed * 3.6) : 0;
      document.getElementById('gpsSpeed').textContent = speedKmH;

      const stops = getStops();
      const targetStop = stops[currentStopIndex];
      if (!targetStop) return;

      const dist = getDistance(latitude, longitude, targetStop.lat, targetStop.lon);
      
      // 動態估算抵站時間 (剩餘時間 = 距離 / 車速，怠速時以市區 20 km/h 預估)
      const effectiveSpeed = Math.max(speedKmH, 20);
      const remainingMinutes = Math.max(1, Math.round((dist / (effectiveSpeed * 1000 / 60))));

      document.getElementById('gpsDetail').textContent = 
        `下一站: ${targetStop.nameZh} | 距目標約 ${Math.round(dist)}m | 估計剩餘: ${remainingMinutes} 分鐘`;

      // 進站判定 (進入 60 米半徑觸發「此站」報站)
      if (dist <= 60) {
        playDingDong();
        if (currentStopIndex < stops.length - 1) {
          setTimeout(() => {
            currentStopIndex++;
            render();
          }, 8000);
        }
      }
    }

    function handleGpsError(err) {
      document.getElementById('gpsStatus').textContent = "定位失敗";
      document.getElementById('gpsDetail').textContent = `錯誤: ${err.message}`;
    }

    // 路線切換監聽
    document.getElementById('routeSelect').addEventListener('change', (e) => {
      currentRoute = e.target.value;
      currentStopIndex = 0;
      render();
    });

    // 初始化運行
    updateDriver();
    render();
  </script>
</body>
</html>
